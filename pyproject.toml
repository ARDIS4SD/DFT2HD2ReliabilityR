# CORRECTION-11 : packaging PEP 621 (cf. CORRECTIONS.md §2, CORRECTION-11).
# Layout src/ unique : src/dft2hd2reliabilityr (la racine et l'ancien dossier
# `source/` n'existent plus).

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dft2hd2reliabilityr"
version = "0.2.1"
description = "Dynamic Fault Tree -> Hasse diagram -> Reliability: minimal cut sets, minimal links and system reliability polynomials"
readme = "README.rst"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Dr. Fotsa-Mbogne David Jaures", email = "jauresfotsa@gmail.com" },
]
maintainers = [
    { name = "Dr. Fotsa-Mbogne David Jaures", email = "jauresfotsa@gmail.com" },
]
keywords = [
    "fault tree",
    "dynamic fault tree",
    "reliability",
    "safety",
    "Hasse diagram",
    "minimal cut sets",
    "minimal links",
    "dependability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Dépendance dure : sympy uniquement (CORRECTION-04 : matplotlib/networkx
# restent optionnels, chargés paresseusement par ViewGraph).
dependencies = [
    "sympy>=1.9",
]

[project.urls]
Homepage = "https://github.com/ARDIS4SD/DFT2HD2ReliabilityR"
Repository = "https://github.com/ARDIS4SD/DFT2HD2ReliabilityR"

[project.optional-dependencies]
# Visualisation (ViewGraph) — importés paresseusement dans les modules.
viz = ["matplotlib>=3.5", "networkx>=2.6"]
# Outillage de test.
test = ["pytest>=7.0"]
# Futur lot IA (ANALYSE.md §5, P3) — réservé, à activer lors de l'ajout de ml.py.
# ml = ["numpy", "scikit-learn"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CORRECTION-12 : base de lint minimaliste pour le legs de code — on intercepte
# les erreurs de syntaxe/runtime et les pièges critiques sans imposer le style
# strict aux ~2 500 lignes antérieures (cf. CORRECTIONS.md).
[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = [
    "E9",   # erreurs de syntaxe/runtime
    "F63",  # comparaisons always-true/false accidentelles
    "F7",   # annotations syntaxiquement invalides
    "F82",  # variables non définies
]

[tool.ruff.lint.per-file-ignores]
# Le legs peut conserver ses longueurs de ligne et imports historiques.
"src/dft2hd2reliabilityr/*.py" = ["E501"]
